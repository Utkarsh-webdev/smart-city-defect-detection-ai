{% extends "base.html" %}

{% block title %}
Municipal Officer Portal Login - SmartDefect AI
{% endblock %}

{% block content %}

<section class="admin-login-page">

    <div class="admin-login-card">

        <div class="bg-dark text-white p-4 text-center">

            <i class="fas fa-shield-halved text-warning fs-1 mb-3"></i>

            <h2 class="fw-bold mb-1">
                Municipal Officer Portal
            </h2>

            <p class="mb-0 opacity-75">
                Authorized Administrative Access Only
            </p>

        </div>

        <div class="p-4 p-md-5">

            <form
                method="POST"
                action="{{ url_for('auth.admin_login') }}"
            >

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Admin Email / Username
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fas fa-user-shield"></i>
                        </span>

                        <input
                            type="text"
                            name="email"
                            class="form-control"
                            placeholder="admin@smartcity.com"
                            required
                        >

                    </div>

                </div>


                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fas fa-key"></i>
                        </span>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >

                    </div>

                </div>


                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="remember"
                            id="rememberAdmin"
                        >

                        <label
                            class="form-check-label small"
                            for="rememberAdmin"
                        >
                            Keep session active
                        </label>

                    </div>

                    <span class="badge bg-warning text-dark">
                        Admin Portal
                    </span>

                </div>


                <button
                    type="submit"
                    class="btn btn-dark w-100 py-3 fw-bold"
                >

                    <i class="fas fa-lock-open text-warning me-2"></i>

                    Access Control Center

                </button>

            </form>


            <div class="text-center mt-4 pt-3 border-top">

                <a
                    href="{{ url_for('auth.citizen_login') }}"
                    class="text-muted small"
                >

                    <i class="fas fa-arrow-left me-1"></i>

                    Switch to Citizen Login

                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
