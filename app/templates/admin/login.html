{% extends "base.html" %}

{% block title %}Municipal Officer Portal Login - SmartDefect AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-dark text-white p-4 text-center">
                    <i class="fas fa-shield-alt text-warning fs-1 mb-2"></i>
                    <h3 class="fw-bold mb-1">Municipal Officer Portal</h3>
                    <p class="mb-0 small text-light opacity-75">Authorized Administrative Access Only</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('auth.admin_login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Admin Email / Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user-shield text-muted"></i></span>
                                <input type="text" name="email" class="form-control" placeholder="admin@smartcity.com" value="admin@smartcity.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key text-muted"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" value="Admin@123" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="remember" id="rememberAdmin" checked>
                                <label class="form-check-label small" for="rememberAdmin">Keep session active</label>
                            </div>
                            <span class="badge bg-warning text-dark">Default: Admin@123</span>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 fw-bold shadow-sm">
                            <i class="fas fa-lock-open me-1 text-warning"></i> Access Control Center
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="{{ url_for('auth.citizen_login') }}" class="text-muted small">
                            <i class="fas fa-arrow-left me-1"></i> Switch to Citizen Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
