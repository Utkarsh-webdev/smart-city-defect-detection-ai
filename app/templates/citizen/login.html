{% extends "base.html" %}

{% block title %}Citizen Login - SmartDefect AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card auth-card">
                <div class="card-header">
                    <i class="fas fa-user-circle fs-1 mb-2"></i>
                    <h3 class="fw-bold mb-1">Citizen Login</h3>
                    <p class="mb-0 small text-light opacity-75">Access your defect reporting dashboard</p>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('auth.citizen_login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="user@example.com"
                                    value="demo@user.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter password"
                                    value="Demo@123" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="remember" id="rememberMe" checked>
                                <label class="form-check-label small" for="rememberMe">Remember me</label>
                            </div>
                            <span class="badge bg-light text-muted border">Demo: Demo@123</span>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                            <i class="fas fa-sign-in-alt me-1"></i> Sign In to Portal
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="{{ url_for('auth.citizen_register') }}" class="fw-bold text-primary ms-1">Register
                            Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
